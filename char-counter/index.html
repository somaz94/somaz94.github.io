  <script>
  (function () {
    var KEY = 'tool-theme';

    function read() {
      try {
        var t = localStorage.getItem(KEY);
        if (t === 'dark' || t === 'light') return t;
        /* One-time adoption of /diagram/'s pre-shared key, then remove it. */
        var legacy = localStorage.getItem('dg-theme');
        localStorage.removeItem('dg-theme');
        if (legacy === 'dark' || legacy === 'light') {
          localStorage.setItem(KEY, legacy);
          return legacy;
        }
      } catch (e) {
        /* Private mode or a full quota — fall through to the OS. */
      }
      return null;
    }

    var chosen = read();
    if (chosen) document.documentElement.setAttribute('data-theme', chosen);

    /* Kept here, not in each tool's ui.js: the pre-paint half and the toggle
       are one decision and must not drift apart. */
    function ready(fn) {
      if (document.readyState !== 'loading') fn();
      else document.addEventListener('DOMContentLoaded', fn);
    }

    ready(function () {
      var btn = document.getElementById('tool-theme');
      if (!btn) return;
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var icon = btn.querySelector('[data-theme-icon]');

      /* The effective theme, not the stored value, or the button reports
         "light" on a page the OS has made dark. */
      function effective() {
        var attr = document.documentElement.getAttribute('data-theme');
        return attr === 'dark' || attr === 'light' ? attr : (mq.matches ? 'dark' : 'light');
      }

      /* Read off the button so a Korean-interface tool can localise the name. */
      var toDark = btn.getAttribute('data-to-dark') || 'Switch to the dark theme';
      var toLight = btn.getAttribute('data-to-light') || 'Switch to the light theme';

      function sync() {
        var dark = effective() === 'dark';
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        /* The name states what a click DOES, not the current state. */
        btn.setAttribute('aria-label', dark ? toLight : toDark);
        btn.title = dark ? toLight : toDark;
        if (icon) icon.textContent = dark ? '☀️' : '🌙';
      }

      btn.addEventListener('click', function () {
        var next = effective() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem(KEY, next); } catch (e) { /* choice holds for this visit only */ }
        sync();
      });

      /* Keeps the button in step while the OS decides. `addListener` is the
         Safari < 14 spelling. */
      var onChange = function () { sync(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);

      sync();
    });
  })();
</script>

  <style>
    /* No webfont: the tool works offline and a CSS @import is render-blocking.
       Pretendard stays first in the stack for wherever it is installed. */
    :root {
      /* Lets the browser's own chrome (caret, selection, scrollbars) go dark too;
         the dark block below cannot do that on its own. */
      color-scheme: light dark;
      --main-bg: linear-gradient(135deg, #f4f6fa 0%, #e9eefd 100%);
      --card-bg: #fff;
      --field-bg: #f9fafb;
      --panel-bg: #f6f8fa;
      --panel-item-bg: #fff;
      --panel-item-line: #f0f1f3;
      --primary: #2563eb;
      /* --accent is the focus ring only (UI component, 3:1). Text such as
         `.top-count` needs 4.5:1, so it gets --accent-text instead. */
      --accent: #3b82f6;
      --accent-text: #1d4ed8;
      /* A token, not `#fff`: `.home-link:hover` puts it on --primary, and white
         on the dark-mode --primary falls to 2.54:1. */
      --on-accent: #fff;
      --border: #e5e7eb;
      --text-main: #23272f;
      --text-sub: #6b7280;
      --radius: 16px;
      --shadow: 0 4px 24px 0 rgba(60,72,88,0.10);
      --counter-shadow: 0 1.5px 6px 0 rgba(60,72,88,0.07);
    }

    /* Inline styles cannot @include the shared mixins, so the dark neutrals are
       `_sass/_tool-tokens.scss`'s ramp copied verbatim under this page's names.
       Nothing stored -> the OS decides; `data-theme` (set pre-paint by
       tool-theme-boot.html) overrides it either way.

       The dark block is written TWICE because plain CSS cannot apply one block
       from both a media query and a bare selector. Order between the two is
       irrelevant; keep the two copies identical. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --main-bg: linear-gradient(135deg, #0b1220 0%, #131c2b 100%);
        --card-bg: #131c2b;
        --field-bg: #0f1826;
        --panel-bg: #182234;
        --panel-item-bg: #212d42;
        --panel-item-line: #2b3854;
        --primary: #60a5fa;
        --accent: #60a5fa;
        --accent-text: #7dd3fc;
        --on-accent: #0b1220;
        --border: #263349;
        --text-main: #e8edf5;
        --text-sub: #94a3b8;
        /* rgba(60,72,88,…) vanishes on a dark surface; black, and deeper. */
        --shadow: 0 4px 24px 0 rgba(0,0,0,0.45);
        --counter-shadow: 0 1.5px 6px 0 rgba(0,0,0,0.35);
      }
    }
    :root[data-theme="dark"] {
        --main-bg: linear-gradient(135deg, #0b1220 0%, #131c2b 100%);
        --card-bg: #131c2b;
        --field-bg: #0f1826;
        --panel-bg: #182234;
        --panel-item-bg: #212d42;
        --panel-item-line: #2b3854;
        --primary: #60a5fa;
        --accent: #60a5fa;
        --accent-text: #7dd3fc;
        --on-accent: #0b1220;
        --border: #263349;
        --text-main: #e8edf5;
        --text-sub: #94a3b8;
        /* rgba(60,72,88,…) vanishes on a dark surface; black, and deeper. */
        --shadow: 0 4px 24px 0 rgba(0,0,0,0.45);
        --counter-shadow: 0 1.5px 6px 0 rgba(0,0,0,0.35);
    }
    /* The browser's own chrome has to follow an explicit choice too. */
    :root[data-theme="dark"] { color-scheme: dark; }
    :root[data-theme="light"] { color-scheme: light; }
    body {
      min-height: 100vh;
      margin: 0;

    /* Selection guard: `tool-content-lock` written out (no mixin in plain CSS),

    textarea {

    .preview-card {

    @media (max-width: 1200px) {

      }

    @media (max-width: 600px) {

      .counter-value {

      }

      }

    /* Keyed off the pointer, never a viewport width. Declared LAST so the 600px
       block above, which shrinks `.home-link` to about 31px, cannot undo it. */
    @media (pointer: coarse) {
      .home-link {
        min-height: 44px;
        box-sizing: border-box;

  </style>

    <h1>글자 수 계산기</h1>
    <div class="main-row">
      <div class="left-col">
        <textarea id="textInput" placeholder="여기에 글을 입력하세요..."></textarea>
      </div>
      <div class="right-col">
        <div class="counter-cards">
          <div class="counter-card"><div class="counter-label">공백 포함 글자수</div><div class="counter-value" id="charCountWithSpace">0</div><div class="counter-unit">자</div></div>
          <div class="counter-card"><div class="counter-label">공백 제외 글자수</div><div class="counter-value" id="charCountWithoutSpace">0</div><div class="counter-unit">자</div></div>
          <div class="counter-card"><div class="counter-label">단어수</div><div class="counter-value" id="wordCount">0</div><div class="counter-unit">개</div></div>
          <div class="counter-card"><div class="counter-label">단락 수</div><div class="counter-value" id="paragraphCount">0</div><div class="counter-unit">개</div></div>
          <div class="counter-card"><div class="counter-label">문장 수</div><div class="counter-value" id="sentenceCount">0</div><div class="counter-unit">개</div></div>
          <div class="counter-card"><div class="counter-label">줄 수</div><div class="counter-value" id="lineCount">1</div><div class="counter-unit">줄</div></div>
        </div>
        <div class="top-strings">
          <h3>가장 많이 출현한 문자열 Top 10</h3>
          <ul id="topStrings"></ul>
        </div>
      </div>
    </div>
    <div class="preview-card">
      <div class="preview-title">미리보기</div>
      <div id="previewText"></div>
    </div>
  </div>
  <script>
    const textInput = document.getElementById("textInput");
    const charCountWithSpace = document.getElementById("charCountWithSpace");
    const charCountWithoutSpace = document.getElementById("charCountWithoutSpace");
    const wordCount = document.getElementById("wordCount");
    const paragraphCount = document.getElementById("paragraphCount");
    const sentenceCount = document.getElementById("sentenceCount");
    const lineCount = document.getElementById("lineCount");
    const topStrings = document.getElementById("topStrings");
    const previewText = document.getElementById("previewText");

    function updateCounts() {
      const text = textInput.value;
      charCountWithSpace.textContent = text.length;
      charCountWithoutSpace.textContent = text.replace(/\s/g, '').length;
      const words = text.trim().split(/\s+/).filter(word => word.length > 0);
      wordCount.textContent = words.length;
      const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
      paragraphCount.textContent = paragraphs.length;
      const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
      sentenceCount.textContent = sentences.length;
      const lines = text.split('\n').filter(line => line.trim().length > 0);
      lineCount.textContent = lines.length || 1;
      const wordFrequency = {};
      /* This regex is the sanitiser for the innerHTML below: it admits no `<`,
         `>`, `&` or quote. Widening it reopens injection silently, so escape in
         the same edit or build the rows with `textContent`. */
      const words2 = text.toLowerCase().match(/[가-힣a-zA-Z0-9]+/g) || [];
      words2.forEach(word => {
        if (word.length > 1) { // count words of 2+ characters only
          wordFrequency[word] = (wordFrequency[word] || 0) + 1;
        }
      });
      const sortedWords = Object.entries(wordFrequency)
        .sort(([,a], [,b]) => b - a)
        .slice(0, 10);
      topStrings.innerHTML = sortedWords
        .map(([word, count], idx) => `<li><span class='top-rank'>${idx+1}</span><span class='top-word'>${word}</span><span class='top-count'>${count}회</span></li>`)
        .join('');
      previewText.textContent = text;
    }
    textInput.addEventListener("input", updateCounts);
    updateCounts();
  </script>
</body>
