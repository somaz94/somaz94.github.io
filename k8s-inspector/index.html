    <script>
  (function () {
    var KEY = 'tool-theme';

    function read() {
      try {
        var t = localStorage.getItem(KEY);
        if (t === 'dark' || t === 'light') return t;
        /* One-time adoption of /diagram/'s pre-shared key, then remove it. */
        var legacy = localStorage.getItem('dg-theme');
        localStorage.removeItem('dg-theme');
        if (legacy === 'dark' || legacy === 'light') {
          localStorage.setItem(KEY, legacy);
          return legacy;
        }
      } catch (e) {
        /* Private mode or a full quota — fall through to the OS. */
      }
      return null;
    }

    var chosen = read();
    if (chosen) document.documentElement.setAttribute('data-theme', chosen);

    /* Kept here, not in each tool's ui.js: the pre-paint half and the toggle
       are one decision and must not drift apart. */
    function ready(fn) {
      if (document.readyState !== 'loading') fn();
      else document.addEventListener('DOMContentLoaded', fn);
    }

    ready(function () {
      var btn = document.getElementById('tool-theme');
      if (!btn) return;
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var icon = btn.querySelector('[data-theme-icon]');

      /* The effective theme, not the stored value, or the button reports
         "light" on a page the OS has made dark. */
      function effective() {
        var attr = document.documentElement.getAttribute('data-theme');
        return attr === 'dark' || attr === 'light' ? attr : (mq.matches ? 'dark' : 'light');
      }

      /* Read off the button so a Korean-interface tool can localise the name. */
      var toDark = btn.getAttribute('data-to-dark') || 'Switch to the dark theme';
      var toLight = btn.getAttribute('data-to-light') || 'Switch to the light theme';

      function sync() {
        var dark = effective() === 'dark';
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        /* The name states what a click DOES, not the current state. */
        btn.setAttribute('aria-label', dark ? toLight : toDark);
        btn.title = dark ? toLight : toDark;
        if (icon) icon.textContent = dark ? '☀️' : '🌙';
      }

      btn.addEventListener('click', function () {
        var next = effective() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem(KEY, next); } catch (e) { /* choice holds for this visit only */ }
        sync();
      });

      /* Keeps the button in step while the OS decides. `addListener` is the
         Safari < 14 spelling. */
      var onChange = function () { sync(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);

      sync();
    });
  })();
</script>

    <link rel="stylesheet" href="/assets/k8s-inspector/theme.css" />
  </head>

  <body>
    <header class="ki-topbar">
      <a class="ki-btn ki-home" href="/" title="Back to somaz.blog" aria-label="Back to somaz.blog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 10.5 12 3.5l8.5 7" />
          <path d="M5.5 9.5v10h13v-10" />
          <path d="M9.75 19.5v-5.5h4.5v5.5" />
        </svg>
        <span class="ki-btn-text">Blog</span>
      </a>

      <h1 class="ki-brand">
        <b>Manifest Inspector</b><span class="ki-brand-site">somaz.blog</span>
      </h1>

      <div class="ki-actions">
        <button id="ki-sample" class="ki-btn" type="button"
                title="Replace the input with an example manifest">
          <span>Sample</span>
        </button>
        <button id="ki-convert" class="ki-btn" type="button"
                title="Convert the input between YAML and JSON">
          <span id="ki-convert-text">To JSON</span>
        </button>
        <button id="ki-copy" class="ki-btn" type="button"
                aria-label="Copy the input to the clipboard"
                title="Copy the input to the clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="11" height="12" rx="1.8" />
            <path d="M15.5 5.5v-1a1 1 0 0 0-1-1h-10a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h1" />
          </svg>
          <span class="ki-btn-text">Copy</span>
        </button>
        <button id="ki-clear" class="ki-btn" type="button"
                aria-label="Empty the input" title="Empty the input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 7h15" />
            <path d="M9.5 7V4.5h5V7" />
            <path d="M6.5 7l1 12.5h9L17.5 7" />
          </svg>
          <span class="ki-btn-text">Clear</span>
        </button>
      </div>

      <button id="tool-theme" class="ki-btn" type="button"
        aria-pressed="false" aria-label="Switch to the dark theme"
        data-to-dark="Switch to the dark theme" data-to-light="Switch to the light theme">
  <span data-theme-icon aria-hidden="true">🌙</span>
  <span class="ki-btn-text">Theme</span>
</button>

    </header>

    <main class="ki-shell">
      <section class="ki-pane ki-pane--input" aria-label="Manifest input">
        <div class="ki-pane-head">
          <h2 class="ki-pane-title">Manifest</h2>
          <span id="ki-input-meta" class="ki-pane-meta"></span>
        </div>

        <textarea
          id="ki-input"
          class="ki-editor"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          placeholder="Paste one or more Kubernetes manifests here. Separate documents with ---&#10;Tab indents; press Escape to move to the report."
          aria-label="Kubernetes manifest source. Tab inserts an indent; press Escape to move focus to the report."
        ></textarea>

        <p id="ki-parse-error" class="ki-parse-error"></p>
      </section>

      <section class="ki-pane ki-pane--report" aria-label="Inspection report">
        <div class="ki-pane-head">
          <h2 class="ki-pane-title">Report</h2>
          <div id="ki-tally" class="ki-tally" hidden>
            <span class="ki-tally-item ki-sev--error"><b id="ki-count-error">0</b> errors</span>
            <span class="ki-tally-item ki-sev--warn"><b id="ki-count-warn">0</b> warnings</span>
            <span class="ki-tally-item ki-sev--ok"><b id="ki-count-ok">0</b> passed</span>
          </div>
        </div>

        <ul id="ki-resources" class="ki-resources" role="list" aria-label="Parsed resources"></ul>

        <div id="ki-findings" class="ki-findings" role="region" tabindex="0"
             aria-label="Findings for the selected resource"></div>

        <div id="ki-empty" class="ki-empty">
          <h3 class="ki-empty-title">Nothing to inspect yet</h3>
          <p>Paste a manifest on the left, or start from an example and edit it.</p>
          <button id="ki-sample-empty" class="ki-btn ki-btn--primary" type="button">
            Load a sample manifest
          </button>
        </div>
      </section>
    </main>

    <p id="ki-status" class="ki-status" role="status" aria-live="polite"></p>

    <footer class="ki-foot">
      Static checks only — this page never contacts a cluster, and nothing you
      paste leaves the browser.
    </footer>

    <noscript>
      <p class="ki-noscript">
        This tool parses and checks manifests in the browser, so it needs
        JavaScript enabled.
      </p>
    </noscript>

    <script src="/assets/k8s-inspector/yaml.js"></script>
    <script src="/assets/k8s-inspector/rules.js"></script>
    <script src="/assets/k8s-inspector/samples.js"></script>
    <script src="/assets/k8s-inspector/inspect.js"></script>
    <script src="/assets/k8s-inspector/ui.js"></script>
  </body>
</html>
