<title>면접 자료</title>
<script>
  (function () {
    var KEY = 'tool-theme';

    function read() {
      try {
        var t = localStorage.getItem(KEY);
        if (t === 'dark' || t === 'light') return t;
        /* One-time adoption of the per-tool keys, then remove them all. */
        var legacy = null;
        ['dg-theme', 'eco-theme'].forEach(function (k) {
          var v = localStorage.getItem(k);
          localStorage.removeItem(k);
          if (!legacy && (v === 'dark' || v === 'light')) legacy = v;
        });
        if (legacy) {
          localStorage.setItem(KEY, legacy);
          return legacy;
        }
      } catch (e) {
        /* Private mode or a full quota — fall through to the OS. */
      }
      return null;
    }

    var chosen = read();
    if (chosen) document.documentElement.setAttribute('data-theme', chosen);

    /* Kept here, not in each tool's ui.js: the pre-paint half and the toggle
       are one decision and must not drift apart. */
    function ready(fn) {
      if (document.readyState !== 'loading') fn();
      else document.addEventListener('DOMContentLoaded', fn);
    }

    ready(function () {
      var btn = document.getElementById('tool-theme');
      if (!btn) return;
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var icon = btn.querySelector('[data-theme-icon]');

      /* The effective theme, not the stored value, or the button reports
         "light" on a page the OS has made dark. */
      function effective() {
        var attr = document.documentElement.getAttribute('data-theme');
        return attr === 'dark' || attr === 'light' ? attr : (mq.matches ? 'dark' : 'light');
      }

      /* Read off the button so a Korean-interface tool can localise the name. */
      var toDark = btn.getAttribute('data-to-dark') || 'Switch to the dark theme';
      var toLight = btn.getAttribute('data-to-light') || 'Switch to the light theme';

      function sync() {
        var dark = effective() === 'dark';
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        /* The name states what a click DOES, not the current state. */
        btn.setAttribute('aria-label', dark ? toLight : toDark);
        btn.title = dark ? toLight : toDark;
        if (icon) icon.textContent = dark ? '☀️' : '🌙';
      }

      btn.addEventListener('click', function () {
        var next = effective() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem(KEY, next); } catch (e) { /* choice holds for this visit only */ }
        sync();
      });

      /* Keeps the button in step while the OS decides. `addListener` is the
         Safari < 14 spelling. */
      var onChange = function () { sync(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);

      sync();
    });
  })();
</script>

<script>/* Private-page envelope — decryption, shared by every encrypted page.
 * Pure: no DOM, no storage, no network.
 *
 * The inverse of `_plugins/private_envelope.rb`. Keep the two in step; the wire
 * format is stated in both and nowhere else.
 *
 *   base64( salt[16] || iv[12] || ciphertext || gcm_tag[16] )
 *
 * The tag rides on the ciphertext because that is what `crypto.subtle.decrypt`
 * expects for AES-GCM; the build side does the concatenation.
 *
 * No verifier hash: a wrong key fails the GCM tag, and a stored hash would give
 * an offline attacker a cheaper target than the payload.
 *
 * A payload may be gzipped before sealing. Its magic bytes (1f 8b) are
 * unambiguous after decryption, because JSON never begins with 0x1f, so the
 * wire format carries no flag for it.
 *
 * Inlined by a Liquid include rather than served from a page's asset directory:
 * an unpublished page drops everything under its own asset prefix, and the
 * other page must not lose its decrypter with it. Liquid renders this file, so
 * it must never contain a Liquid tag or output marker, nor a closing script tag.
 *
 * Web Crypto needs a secure context; on plain http `crypto.subtle` is undefined
 * rather than throwing, so `available()` is checked up front instead of the case
 * surfacing as a wrong password.
 */
(function (global) {
  'use strict';

  var SALT_BYTES = 16;
  var IV_BYTES = 12;
  var TAG_BYTES = 16;

  var MESSAGES = {
    unsupported: '이 브라우저에서는 복호화를 할 수 없습니다. HTTPS로 접속했는지 확인해 주세요.',
    empty: '이 페이지에 암호화된 내용이 없습니다.',
    corrupt: '페이지의 데이터가 손상되었습니다.',
    unreadable: '복호화는 됐지만 내용을 읽을 수 없습니다.',
    wrong: '비밀번호가 올바르지 않습니다.'
  };

  function b64ToBytes(b64) {
    var bin = global.atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* Tagged with `.kind` so the caller never has to parse the message. */
  function fail(kind, message) {
    var e = new Error(message);
    e.kind = kind;
    return e;
  }

  /* Inflate is opt-in: a plain payload must still open without DecompressionStream. */
  function available(opts) {
    var ok = !!(global.crypto && global.crypto.subtle && global.TextDecoder);
    if (ok && opts && opts.inflate) {
      ok = typeof global.DecompressionStream === 'function' &&
        typeof global.Response === 'function' &&
        typeof global.Blob === 'function' &&
        typeof global.Blob.prototype.stream === 'function';
    }
    return ok;
  }

  function isGzip(bytes) {
    return bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
  }

  function inflate(bytes) {
    var stream = new global.Blob([bytes]).stream()
      .pipeThrough(new global.DecompressionStream('gzip'));
    return new global.Response(stream).arrayBuffer();
  }

  /* passphrase + payload -> the decoded document.
     Rejects with .kind of 'unsupported' | 'empty' | 'malformed' | 'wrong'.
     `options.messages` overrides any of MESSAGES for the calling page. */
  function unlock(payloadB64, passphrase, iterations, options) {
    var msg = Object.assign({}, MESSAGES, options && options.messages);

    if (!available()) return Promise.reject(fail('unsupported', msg.unsupported));
    if (!payloadB64) return Promise.reject(fail('empty', msg.empty));

    var raw;
    try {
      raw = b64ToBytes(payloadB64);
    } catch (e) {
      return Promise.reject(fail('malformed', msg.corrupt));
    }
    /* Too short to hold a tag: corruption, not a wrong password. */
    if (raw.length <= SALT_BYTES + IV_BYTES + TAG_BYTES) {
      return Promise.reject(fail('malformed', msg.corrupt));
    }

    var salt = raw.slice(0, SALT_BYTES);
    var iv = raw.slice(SALT_BYTES, SALT_BYTES + IV_BYTES);
    var body = raw.slice(SALT_BYTES + IV_BYTES);
    var subtle = global.crypto.subtle;

    return subtle
      .importKey('raw', new global.TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, body);
      })
      /* Only the derivation and the tag check can mean a wrong password; what
         fails after the tag passed is corruption, reported separately below. */
      .catch(function () {
        throw fail('wrong', msg.wrong);
      })
      .then(function (buf) {
        var bytes = new Uint8Array(buf);
        if (!isGzip(bytes)) return bytes;
        if (!available({ inflate: true })) throw fail('unsupported', msg.unsupported);
        return inflate(bytes).then(
          function (out) { return new Uint8Array(out); },
          function () { throw fail('malformed', msg.unreadable); }
        );
      })
      .then(function (bytes) {
        try {
          return JSON.parse(new global.TextDecoder().decode(bytes));
        } catch (e) {
          throw fail('malformed', msg.unreadable);
        }
      });
  }

  global.PrivateEnvelope = { unlock: unlock, available: available };
})(globalThis);
